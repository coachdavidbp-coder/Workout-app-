name: Deploy to Firebase Hosting

# Deploys the app to https://us-vs-them-fd820.web.app whenever the code
# changes on main or the working branch. You can also trigger it by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
      - claude/college-football-training-app-7lv5l0
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: us-vs-them-fd820
          channelId: live
